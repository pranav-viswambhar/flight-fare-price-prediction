<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flight Price Prediction</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #dfe9f3, #ffffff);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: #4b6cb7;
      background-image: linear-gradient(to right, #182848, #4b6cb7);
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }

    .navbar-nav .nav-link {
      color: #f0f0f0 !important;
      margin-left: 15px;
      transition: color 0.3s ease;
    }

    .navbar-nav .nav-link:hover {
      color: #ffd700 !important;
    }

    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
    }

    .card-glass {
      background: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 700px;
      width: 100%;
      overflow: hidden;
    }

    .card-header {
      background: #4b6cb7;
      color: white;
      text-align: center;
      font-size: 1.6rem;
      padding: 20px;
      font-weight: 700;
    }

    .result-message {
      text-align: center;
      font-size: 1.2rem;
      padding: 20px;
      color: #333;
    }

    .result-message.green {
      color: #28a745;
    }

    .result-message.red {
      color: #dc3545;
    }

    .prediction-table {
      margin: 0 auto 30px;
      width: 90%;
    }

    .prediction-table th,
    .prediction-table td {
      font-size: 1.1rem;
      padding: 12px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #6c757d;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">AirFare Prediction</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="/m">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/p">Predict</a></li>
          <li class="nav-item"><a class="nav-link" href="/">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-container">
    <div class="card card-glass">
      <div class="card-header">AirFare Prediction Result</div>
      <div class="result-message {{ prediction_class }}">
        {{ prediction_message }}
      </div>
      <div class="table-responsive">
        <table class="table table-bordered prediction-table text-center">
          <thead class="table-success">
            <tr>
              <th>Predicted Price</th>
              <th><strong>{{ prediction_text }}</strong></th>
            </tr>
          </thead>
        </table>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 Team-C13. All rights reserved.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
